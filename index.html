<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🍀 Mi Rincón Verde - Catálogo</title>
    <!-- CSS externo -->
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>🍀 Mi Rincón <span>Verde</span></h1>
            <p>🐞 Catálogo interactivo · ¡Toca y compra!</p>
        </div>

        <!-- FILTROS -->
        <div class="filtros" id="filtrosContainer">
            <!-- Los botones se generan automáticamente con JS -->
        </div>

        <!-- GRID DE PRODUCTOS -->
        <div class="grid-productos" id="gridProductos">
            <!-- Los productos se renderizan aquí con JS -->
        </div>

        <div class="footer">
            🌱 Haz clic en "Comprar" y el pedido llega directo a nuestro WhatsApp.
        </div>
    </div>

    <!-- Scripts externos -->
    <script src="js/catalogo.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
